name: Revise Duplicate Articles (AI)

on:
  schedule:
    # 18:00 UTC = 01:00 WIB, daily.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  revise:
    runs-on: ubuntu-latest
    env:
      # Cloudflare WORKERS AI credentials (not the Pages hosting). Without them the job skips itself.
      CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      # Housekeeping: GitHub runners ship ~14 GB of toolchains this repo never uses. Removing them
      # keeps `npm ci` + Hugo from hitting "No space left on device" on a large public/ folder.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Check Cloudflare Workers AI secrets
        if: env.CF_TOKEN_PRESENT != 'true'
        run: echo "⚠️  CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are not set — skipping this run."

      - name: Checkout Repository
        if: env.CF_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.CF_TOKEN_PRESENT == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'

      - name: Install Dependencies
        if: env.CF_TOKEN_PRESENT == 'true'
        run: npm ci

      - name: Analyze Duplicate Candidates (Layer 1 — fast, offline, results NOT committed)
        if: env.CF_TOKEN_PRESENT == 'true'
        run: node tools/dedup-lapis1.js

      - name: Revise Articles (staged, max 20/day)
        if: env.CF_TOKEN_PRESENT == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/revise-articles.js --apply --limit=20

      - name: Configure Git
        if: env.CF_TOKEN_PRESENT == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Revisions
        id: commit_push
        if: env.CF_TOKEN_PRESENT == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add content/
          [ -f revised-articles.log ] && git add revised-articles.log
          [ -f .revise-progress.json ] && git add .revise-progress.json

          if git diff --staged --quiet; then
            echo "ℹ️  Nothing to commit (0 articles revised this session) — done."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Progress/log files are committed every run, but a deploy is only worth it when article
          # files actually changed (a run where every AI answer was rejected changes only the log).
          if git diff --staged --name-only | grep -q '^content/'; then
            CONTENT_CHANGED=true
          else
            CONTENT_CHANGED=false
          fi

          git commit -m "Revisi: kurangi kemiripan konten"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push succeeded (attempt $i)."
              echo "published=$CONTENT_CHANGED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push still failed after 5 attempts — possible real conflict, check manually." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push rejected (possible race with another workflow), rebase & retry in ${wait_s}s... (attempt $i/5)"
            sleep "$wait_s"
            git fetch origin master
            git stash push -u -m "pre-rebase-autostash" || true
            git rebase origin/master
            git stash drop || true
          done

      - name: Trigger Deploy (publish today's revisions now)
        if: env.CF_TOKEN_PRESENT == 'true' && steps.commit_push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Revisions pushed — triggering deploy.yml so they go live now..."
          gh workflow run deploy.yml --ref master
